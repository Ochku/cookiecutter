[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = {{ cookiecutter.module_name|tojson }}
version = "0.0.1"
description = {{ cookiecutter.description|tojson }}
authors = [
  { name = {{ cookiecutter.author_name|tojson }} },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3"
]

{% if cookiecutter.use_pre_commit == "yes" %}
[tool.black]
line-length = 88  # Max line length to improve readability on standard-width screens
target-version = ['{{ 'py' ~ cookiecutter.python_version_number.replace(".", "") }}']  # Target Python in line with choosen version (adjust to your project's minimum Python version)
include = '\.pyi?$'  # Format .py and .pyi (stub) files
exclude = '''
/(              # Exclude these folders/files from formatting
    \.git       # Git repo metadata
  | \.venv      # Virtual environments
  | build       # Build artifacts
  | dist        # Distribution packages
  | migrations  # Django/SQLAlchemy migrations
)/
'''

[tool.ruff]
line-length = 88  # Max line length, matches Black
src = ["{{ cookiecutter.module_name }}"]
target-version = "{{ 'py' ~ cookiecutter.python_version_number.replace(".", "") }}" # in line with choosen version
lint.select = [
    "E",  # pycodestyle: basic style violations
    "F",  # pyflakes: unused variables, undefined names
    "B",  # bugbear: security and best practice issues
    "I",  # isort: import sorting checks
    "C90",  # McCabe: code complexity (cyclomatic)
    "N",  # pep8-naming: naming conventions
    "D",  # pydocstyle: docstring style
    "UP",  # pyupgrade: outdated Python syntax (e.g., use f-strings)
    "PL",  # pylint: general linting checks (optional use)
    "RUF",  # Ruff-specific enhancements and rules
]
lint.ignore = [
    "D100",  # Ignore missing docstring for public modules
    "D104",  # Ignore missing docstring for public packages
    "D107",  # Ignore missing docstring in __init__ methods
    "E501",  # Ignore line length errors (handled by Black)
]
show-fixes = true  # Show which fixes Ruff automatically applied

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.module_name }}"]  # Treat these as local imports (customize for your project structure)
combine-as-imports = true  # Combine multiple 'as' imports on a single line
force-sort-within-sections = true  # Enforce sorting within import blocks (std, 3rd party, local)

[tool.ruff.lint.pydocstyle]
convention = "google"  # Enforce Google-style docstrings (instead of NumPy, etc.)

[tool.ruff.lint.mccabe]
max-complexity = 10  # Maximum allowed cyclomatic complexity before a function is considered too complex

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"  # Enforce double quotes for inline strings
multiline-quotes = "double"  # Enforce double quotes for multi-line strings
docstring-quotes = "double"  # Enforce double quotes for docstrings

[tool.ruff.format]
docstring-code-format = true  # Format code examples inside docstrings
quote-style = "double"  # Convert all string quotes to double
skip-magic-trailing-comma = false  # Allow magic trailing commas (compatible with Black)

[tool.ruff.lint.per-file-ignores]
"migrations/*.py" = ["E501", "F401"]  # Allow longer lines and unused imports in migration files (commonly auto-generated)

{% endif %}