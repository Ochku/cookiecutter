name: {{ cookiecutter.repo_name }}
channels:
  - conda-forge
  - defaults
dependencies:
  - python={{ cookiecutter.python_version_number }}
  # Core data science packages
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - jupyter>=1.0.0
  - pymysql>=1.0.0
  # Development tools
  - ruff>=0.4.0
  - black>=24.0.0
  - mypy>=1.9.0
  - pytest>=8.0.0
  - conda-lock
  # Additional packages
  - loguru>=0.7.0
  - tqdm>=4.60.0
  # Pip-only packages
  - pip:
    - pydantic>=2.0.0
    - pydantic-settings>=2.0.0
    - python-dotenv>=1.0.0
    - bandit>=1.7.7
    - nbstripout>=0.6.1
    {% if cookiecutter.use_pre_commit == "yes" %}
    - pre-commit>=3.5.0 
    {% endif %}
    - mkdocs-material