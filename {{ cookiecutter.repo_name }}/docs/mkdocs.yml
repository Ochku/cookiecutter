site_name: image generator
#
site_author: steff vleeshouwers
#
site_description: >-
  Developer-friendly, beautiful documentation powered by MkDocs Material.
site_url: https://example.com
repo_url: https://github.com/your-org/your-repo
repo_name: your-org/your-repo
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - header.autohide
    - palette.toggle  # Enables light/dark toggle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Fira Code
  favicon: assets/images/favicon.ico

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
  - References:
      - API Reference: references/api.md
  - Decision log: decision_log.md
  
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
  - footnotes
  - meta
  - def_list
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

