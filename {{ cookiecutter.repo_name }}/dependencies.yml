# Core dependencies available in both conda and pip
dependencies:
  python: "{{ cookiecutter.python_version_number }}"
  packages:
    numpy: ">=1.24.0"
    pandas: ">=2.0.0"
    scikit-learn: ">=1.3.0"
    matplotlib: ">=3.7.0"
    seaborn: ">=0.12.0"
    jupyter: ">=1.0.0"

# Development tools (primarily installed via pip)
dev_dependencies:
  {% if cookiecutter.use_pre_commit == "yes" %}
  ruff: ">=0.4.0"
  black: ">=24.0.0"
  mypy: ">=1.9.0"
  bandit: ">=1.7.7"
  nbstripout: ">=0.6.1"
  pre-commit: ">=3.5.0"
  {% endif %}
  pytest: ">=8.0.0"

# Pip-only packages (not available or outdated in conda)
pip_only:
  pydantic: ">=2.0.0"
  pydantic-settings: ">=2.0.0"
  python-dotenv: ">=1.0.0" 